app = "test-ex-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/up"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://test-ex-api.fly.dev"
  LOG_LEVEL = "error"
  BROADCAST_CONNECTION = "reverb"
  QUEUE_CONNECTION = "sync"
  CACHE_STORE = "database"
  SESSION_DRIVER = "database"
  REVERB_APP_ID = "755289"
  REVERB_APP_KEY = "cxlqav5hmkaaibztf1pe"
  REVERB_HOST = "test-ex-api.fly.dev"
  REVERB_PORT = "443"
  REVERB_SCHEME = "https"
  VITE_REVERB_APP_KEY = "cxlqav5hmkaaibztf1pe"
  VITE_REVERB_HOST = "test-ex-api.fly.dev"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "https"
  DB_CONNECTION = "pgsql"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
